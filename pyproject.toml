[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packetexchange"
version = "0.4.0"
description = "Python SDK for the PacketExchange voice and SMS marketplace API, with models generated from the public OpenAPI spec."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "PacketExchange", email = "support@packetexchange.io" }]
keywords = ["packetexchange", "voip", "sms", "otp", "verification", "telecom", "sdk", "api", "openapi", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "build>=1.2"]

[project.urls]
Homepage = "https://packetexchange.io"
Documentation = "https://packetexchange.io/api-docs"
Source = "https://github.com/PacketExchangeIO/packetexchange-python"
Issues = "https://github.com/PacketExchangeIO/packetexchange-python/issues"
Changelog = "https://github.com/PacketExchangeIO/packetexchange-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/packetexchange"]

[tool.hatch.build.targets.sdist]
include = ["src/packetexchange", "scripts/generate.py", "openapi.json", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# The package supports Python 3.9 at runtime; current mypy type-checks 3.10+ targets.
python_version = "3.10"
strict = true
files = ["src", "tests"]
